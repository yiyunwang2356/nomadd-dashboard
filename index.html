<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Nomadd Haus｜內部待辦管理</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="login-screen">
    <div class="login-card">
      <div class="logo-badge">⌂ Nomadd Haus</div>
      <h1>內部待辦管理系統</h1>
      <p>請使用公司 Google 帳號登入<br/>（@nomaddhaus.com）</p>
      <button class="primary-btn" id="google-login-btn">使用 Google 登入</button>
    </div>
  </div>

  <div id="main-app">
    <div class="shell">
      <header>
        <div class="brand">
          <h1>Nomadd Haus｜待辦管理系統</h1>
          <p>重複任務自動重置 · 月曆檢視 · 緊急事項 Pin 置頂</p>
        </div>
        <div class="user-area">
          <span class="pill" id="user-name"></span>
          <button class="ghost-btn" id="logout-btn">登出</button>
        </div>
      </header>

      <div class="toolbar">
        <select id="assignee-filter"><option value="全部">全部人員</option></select>
        <select id="dept-filter">
          <option value="全部">全部部門</option>
          <option value="行政">行政</option>
          <option value="會計">會計</option>
          <option value="PT">PT</option>
          <option value="文宣">文宣</option>
          <option value="場地">場地</option>
          <option value="行銷">行銷</option>
        </select>
        <select id="type-filter">
          <option value="全部">全部類型</option>
          <option value="每週重複">每週重複</option>
          <option value="每月重複">每月重複</option>
          <option value="單次截止">單次截止</option>
        </select>
        <select id="pin-filter">
          <option value="全部">全部事項</option>
          <option value="onlyPinned">只看 Pin</option>
          <option value="onlyUnpinned">不含 Pin</option>
        </select>
        <button class="mode-btn active" id="listModeBtn" onclick="switchMode('list')">清單</button>
        <button class="mode-btn" id="calendarModeBtn" onclick="switchMode('calendar')">月曆</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-dept="全部">全部</button>
        <button class="tab-btn" data-dept="行政">行政</button>
        <button class="tab-btn" data-dept="會計">會計</button>
        <button class="tab-btn" data-dept="PT">PT</button>
        <button class="tab-btn" data-dept="文宣">文宣</button>
        <button class="tab-btn" data-dept="場地">場地</button>
        <button class="tab-btn" data-dept="行銷">行銷</button>
      </div>

      <div id="add-task-form" style="display:none;">
        <div class="panel-title">➕ 新增待辦事項</div>
        <div class="add-grid">
          <input type="text" id="task-title" placeholder="待辦事項名稱" />
          <select id="task-dept">
            <option value="行政">行政</option>
            <option value="會計">會計</option>
            <option value="PT">PT</option>
            <option value="文宣">文宣</option>
            <option value="場地">場地</option>
            <option value="行銷">行銷</option>
          </select>
          <select id="task-type" onchange="onTypeChange()">
            <option value="每週重複">每週重複</option>
            <option value="每月重複">每月重複</option>
            <option value="單次截止">單次截止</option>
          </select>
          <select id="task-assignee" onchange="onAssigneeChange()">
            <option value="">選擇負責人</option>
          </select>
          <input type="email" id="task-assignee-email" placeholder="負責人 Email（自動帶入）" readonly />
          <div class="date-wrap">
            <label class="date-label">📅 截止日期</label>
            <input type="date" id="task-date" />
          </div>
          <button class="ghost-btn" id="new-pin-btn">📌 未 Pin</button>
          <button class="primary-btn" id="add-task-btn">新增</button>
        </div>
        <div id="type-hint" class="type-hint">🔁 每週重複：每週一自動重置為未完成</div>
      </div>

      <div class="main-grid">
        <aside class="pinned-panel">
          <div class="panel-title">📌 緊急待辦</div>
          <div id="pinned-list" class="pinned-list"></div>
        </aside>
        <section class="content-area">
          <div id="list-view">
            <div class="task-columns">
              <div class="column"><h2>🔁 每週重複</h2><ul id="weekly-list"  class="task-list"></ul></div>
              <div class="column"><h2>📆 每月重複</h2><ul id="monthly-list" class="task-list"></ul></div>
            </div>
            <div class="column full-col" style="margin-top:16px"><h2>📌 單次截止</h2><ul id="once-list" class="task-list"></ul></div>
          </div>
          <div id="calendar-view" style="display:none;">
            <div class="calendar-card">
              <div class="calendar-head">
                <h2 id="calendar-title"></h2>
                <div class="calendar-nav">
                  <button class="ghost-btn" onclick="changeMonth(-1)">◀</button>
                  <button class="ghost-btn" onclick="changeMonth(1)">▶</button>
                </div>
              </div>

              <!-- 月曆人員 Tab ← 新增 -->
              <div class="cal-member-tabs" id="cal-member-tabs">
                <button class="cal-tab-btn active" data-member="全部">全部</button>
              </div>

              <div class="calendar-grid" id="calendar-grid"></div>

              <!-- 點擊日期後展開的任務清單 ← 新增 -->
              <div id="cal-day-detail" class="cal-day-detail" style="display:none;">
                <div class="cal-day-detail-title" id="cal-day-detail-title"></div>
                <ul class="cal-day-task-list" id="cal-day-task-list"></ul>
              </div>

            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
